name: Verify AWS OIDC Connection

on:
  push:
    branches:
      - oidc-test
  workflow_dispatch: # Allows you to trigger this manually from the GitHub UI

# CRITICAL: These permissions are strictly required for OIDC authentication
permissions:
  id-token: write # Allows GitHub to request the OIDC JWT token
  contents: read  # Allows the runner to check out the code

jobs:
  verify-aws-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::064713309555:role/GitHubActions-Whispe-Deploy
          aws-region: us-east-1 # Replace with your target AWS region

      - name: Verify AWS Authentication
        run: aws sts get-caller-identity
