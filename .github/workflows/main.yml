name: Chatter Backend CI/CD

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push Docker image
        id: build-image
        run: |
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/chatter-backend-app:${{ github.sha }}"
          echo "Building image: $IMAGE_NAME"
          docker build -t "$IMAGE_NAME" .
          docker push "$IMAGE_NAME"

      - name: Write image name to file
        run: |
          echo "${{ secrets.DOCKERHUB_USERNAME }}/chatter-backend-app:${{ github.sha }}" > image.txt

      - name: Upload image-name artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-name
          path: image.txt

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Download image-name artifact
        uses: actions/download-artifact@v4
        with:
          name: image-name

      - name: Read image name into env
        id: read-image
        run: |
          IMAGE="$(cat image.txt)"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: "DEBUG: show image to pull"
        run: |
          echo "Pulling image: $IMAGE"

      - name: Pull the image
        run: docker pull "$IMAGE"

      - name: Remove old container (if any)
        run: docker rm -f chatter-app-container || true

      - name: Run the container
        run: |
          docker run -d -p 7000:7000 \
            --name chatter-app-container \
            -e PORT="${{ secrets.PORT }}" \
            -e MONGODB_CONNECTING_URL="${{ secrets.MONGODB_CONNECTING_URL }}" \
            -e JWT_ACCESS_TOKEN_SECRET="${{ secrets.JWT_ACCESS_TOKEN_SECRET }}" \
            -e ACCESS_TOKEN_EXPIRATION="${{ secrets.ACCESS_TOKEN_EXPIRATION }}" \
            -e JWT_REFRESH_TOKEN_SECRET="${{ secrets.JWT_REFRESH_TOKEN_SECRET }}" \
            -e REFRESH_TOKEN_EXPIRATION="${{ secrets.REFRESH_TOKEN_EXPIRATION }}" \
            -e ENCRYPTION_KEY="${{ secrets.ENCRYPTION_KEY }}" \
            -e FRONTEND_URL="${{ secrets.FRONTEND_URL }}" \
            -e AWS_REGION="${{ secrets.AWS_REGION }}" \
            -e AWS_S3_BUCKET_NAME="${{ secrets.AWS_S3_BUCKET_NAME }}" \
            "$IMAGE"
